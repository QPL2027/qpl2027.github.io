# Set theme
remote_theme: daviddarnes/alembic@main

# File excludes
exclude:
- README.md
- Gemfile
- Gemfile.lock
- vendor

# Set plugins
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-feed
- jekyll-commonmark
- jekyll-include-cache
- jemoji
- jekyll-remote-theme

# Site settings
url: 'https://qpl2027.github.io/'
baseurl: ''
title: 'QPL'
description: 'Official Website for the QPL 2027 Conference'
permalink: pretty
logo: "/images/logo.png"
custom_css:
- /assets/custom.css

# Pagination
# paginate: 5
# paginate_path: blog/page:num

# Header nav
navigation_header:
- title: Home
  url: /
- title: Local Information
  url: /local_info/
- title: Program
  url: /program/
- title: Tutorials
  url: /tutorial/
- title: Career Fair
  url: /career_fair/
- title: Registration
  url: /registration/
- title: Sponsors
  url: /sponsors
# - title: Accepted Submissions
#  url: /accepted/

# Footer nav
navigation_footer:
  - title: Back to top
    url: "#top"

# Collection settings
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages
